def shared = layout.projectDirectory.dir('../../shared/src/main')
def sharedSources = [
        java: [root: shared.dir('java').asFile,
               path: 'committee/nova/mods/avaritia/api/client/screen/component/PortableLayout.java'],
        resources: [root: shared.dir('resources').asFile,
                    path: 'assets/avaritia/textures/block/chest/compressed_chest.png']
]

sharedSources.each { kind, source ->
    sourceSets.main[kind].srcDir(source.root)
}

def validateSharedSources = tasks.register('validateSharedSources') {
    doLast {
        sharedSources.each { kind, source ->
            File canonical = new File(source.root, source.path)
            if (!canonical.isFile()) {
                throw new GradleException("Missing shared source: ${canonical}")
            }
            sourceSets.each { sourceSet ->
                sourceSet[kind].srcDirs.each { directory ->
                    if (sourceSet.name == 'main' && directory == source.root) {
                        return
                    }
                    File candidate = new File(directory, source.path)
                    if (candidate.exists()) {
                        throw new GradleException("Source set ${sourceSet.name} shadows shared source: ${candidate}")
                    }
                }
            }
        }
    }
}

// Check before either consumer, including direct task invocations and generated resource roots.
tasks.withType(JavaCompile).configureEach { dependsOn(validateSharedSources) }
tasks.withType(ProcessResources).configureEach { dependsOn(validateSharedSources) }
tasks.named('sourcesJar') { dependsOn(validateSharedSources) }
tasks.named('javadoc') { dependsOn(validateSharedSources) }
