def shared = layout.projectDirectory.dir('../../shared')
def sharedSources = [
        java: [root: shared.dir('src/main/java').asFile,
               path: 'committee/nova/mods/avaritia/api/client/screen/component/PortableLayout.java'],
        resources: [root: shared.dir('src/main/resources').asFile,
                    path: 'assets/avaritia/textures/block/chest/compressed_chest.png']
]

def checks = sharedSources.collect { kind, source ->
    sourceSets.main[kind].srcDir(source.root)
    def duplicates = sourceSets.collectEntries { sourceSet ->
        def candidates = sourceSet[kind].srcDirs.findAll { directory ->
            sourceSet.name != 'main' || directory != source.root
        }.collect { directory -> new File(directory, source.path) }
        [(sourceSet.name): candidates]
    }
    [canonical: new File(source.root, source.path), duplicates: duplicates]
}

def validateSharedSources = tasks.register('validateSharedSources') {
    doLast {
        checks.each { source ->
            if (!source.canonical.isFile()) {
                throw new GradleException("Missing shared source: ${source.canonical}")
            }
            source.duplicates.each { sourceSet, candidates ->
                candidates.findAll { it.exists() }.each { candidate ->
                    throw new GradleException("Source set ${sourceSet} shadows shared source: ${candidate}")
                }
            }
        }
    }
}

// Check before either consumer, including direct task invocations and generated resource roots.
tasks.withType(JavaCompile).configureEach { dependsOn(validateSharedSources) }
tasks.withType(ProcessResources).configureEach { dependsOn(validateSharedSources) }
tasks.withType(Jar).configureEach {
    if (name == 'sourcesJar') dependsOn(validateSharedSources)
}
tasks.withType(Javadoc).configureEach { dependsOn(validateSharedSources) }
