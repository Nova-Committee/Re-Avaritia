plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id "me.shedaniel.unified-publishing" version "0.1.+"
    id 'fabric-loom' version "1.11-SNAPSHOT"
}

version = mc_version + "-" + mod_version + "-" + mod_version_tag
group = mod_group_id

base {
    archivesName = mod_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

loom {
    if (file("src/main/resources/${mod_id}.accesswidener").exists())
        accessWidenerPath.set(file("src/main/resources/${mod_id}.accesswidener"))
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = "https://maven.covers1624.net/" }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.melanx.de/' }
    maven { url = "https://maven.architectury.dev" }
    maven { url = "https://maven.saps.dev/minecraft" }
    maven { url = "https://mvn.devos.one/releases/" }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
    maven { url = 'https://jitpack.io' }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = 'https://modmaven.dev/' }
    maven { url = "https://maven.latvian.dev/releases" }
    maven { url = "https://www.cursemaven.com" }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${project.mc_version}")
    mappings loom.officialMojangMappings()
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$config_version"
    for (String module in port_lib_modules.split(","))
        modImplementation(include("io.github.fabricators_of_create.Porting-Lib:$module:$port_lib_version+$mc_version"))
    modImplementation(include("com.github.Chocohead:Fabric-ASM:v2.3"))

    modImplementation("com.blamejared.crafttweaker:CraftTweaker-fabric-${mc_version}:${crafttweaker_version}")
    modImplementation("curse.maven:jade-324717:${jade_id}")

    modApi "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modApi "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modApi "dev.emi:trinkets:${trinkets_version}"

    modImplementation("dev.latvian.mods:kubejs-fabric:${kubejs_version}")
    modImplementation("dev.latvian.mods:rhino-fabric:${rhino_version}")
    modImplementation("dev.architectury:architectury-fabric:${architectury_version}")

    modImplementation("curse.maven:charm-of-undying-316873:${cou_version}")
    modRuntimeOnly("curse.maven:applied-energistics-2-223794:${ae2_version}")

    modImplementation("curse.maven:configured-457570:${configured_version}")
    compileOnly("org.projectlombok:lombok:$lombok_version")
    annotationProcessor("org.projectlombok:lombok:$lombok_version")

    // compile against the JEI API but do not include it at runtime
    modCompileOnly("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${mc_version}-fabric:${jei_version}")

    // REI
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")

    // EMI
    modCompileOnly("dev.emi:emi-fabric:${emi_version}")

    if (project.recipe_viewer == 'jei')
        modRuntimeOnly("mezz.jei:jei-${mc_version}-fabric:${jei_version}")
    else if (project.recipe_viewer == 'rei')
        modRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")
    else if (project.recipe_viewer == 'emi')
        modRuntimeOnly("dev.emi:emi-fabric:${project.emi_version}")
    else
        println("unknown recipe viewer: $recipe_viewer")
}

processResources {
    var replaceProperties = [
            minecraft_version: mc_version, mc_range: mc_range,
            mod_id           : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            issue_tracker    : issue_tracker,
            mod_authors      : mod_authors, mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties + [project: project]
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    inputs.property "archivesName", project.base.archivesName
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        if (System.getenv('MAVEN_USERNAME') != null && System.getenv('MAVEN_PASSWORD') != null) {
            maven {
                name 'S3'
                url = 'https://maven.nova-committee.cn/s3'

                credentials {
                    username System.getenv('MAVEN_USERNAME')
                    password System.getenv('MAVEN_PASSWORD')
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.add("-Xlint:-removal")
}

unifiedPublishing {
    project {
        displayName = mod_name
        version = mc_version + "-" + mod_version // Optional, Inferred from project by default
        changelog = file("CHANGELOG.md").exists() ? file("CHANGELOG.md").text : "" // Optional, in markdown format
        releaseType = release_type // Optional, use "release", "beta" or "alpha"
        gameVersions = ["1.20", "1.20.1"]
        gameLoaders = ["forge"]

        mainPublication tasks.jar // Declares the publicated jar
        //secondaryPublications.builtBy(tasks.apiJar)

        if (System.getenv('CURSE_TOKEN') != null) {
            curseforge {
                token = System.getenv("CURSE_TOKEN")
                id = "623969" // Required, must be a string, ID of CurseForge project
//
////            relations { // Optional, Inferred from the relations above by default
////                optional "jei"
////            }
            }
        }


        modrinth {
            token = System.getenv("MODRINTH_TOKEN")
            id = "QeB3NRC5" // Required, must be a string, ID of Modrinth project
            displayName = mod_name

//            relations { // Optional, Inferred from the relations above by default
//                optional "jei"
//            }
        }
    }
}