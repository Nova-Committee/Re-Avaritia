plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = mod_group_id
version = "${mc_version}-${mod_version}-${mod_version_tag}"
base { archivesName = "${mod_name}-${mod_platform}" }

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.latvian.dev/releases/' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.ladysnake.org/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"
    compileOnly "org.jetbrains:annotations:${annotations_version}"
    compileOnly "com.google.code.findbugs:jsr305:${jsr305_version}"
    compileOnly "org.openzen.zencode:JavaAnnotations:${zencode_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Optional APIs are compile-only and never bundled into the release JAR.
    // Optional API implementations inherit Fabric API interfaces; Loom needs that hierarchy even in default builds.
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly("dev.emi:emi-fabric:${emi_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${mc_version}-common-api:${jei_version}") { transitive = false }
    modCompileOnly("mezz.jei:jei-${mc_version}-fabric-api:${jei_version}") { transitive = false }
    modCompileOnly("dev.latvian.mods:kubejs-fabric:${kubejs_version}") { transitive = false }
    modCompileOnly("dev.latvian.mods:rhino-fabric:${rhino_version}") { transitive = false }
    modCompileOnly("com.blamejared.crafttweaker:CraftTweaker-fabric-${mc_version}:${crafttweaker_version}") { transitive = false }
    modCompileOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
    modCompileOnly("maven.modrinth:trinkets:${trinkets_version}") { transitive = false }
    modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}") { transitive = false }
    if (project.hasProperty('withTrinkets')) {
        // Use the official release: the dev.emi Maven artifact retains Yarn-only widget shadows.
        modRuntimeOnly "maven.modrinth:trinkets:${trinkets_version}"
        modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${trinkets_fabric_api_version}"
        modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
        modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"
    }
    if (project.hasProperty('withClientIntegrations')) {
        // Local development only: no published or bundled prerequisite mods.
        [
                "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}",
                "com.blamejared.crafttweaker:CraftTweaker-fabric-${mc_version}:${crafttweaker_version}",
                "dev.latvian.mods:kubejs-fabric:${kubejs_version}"
        ].each { coordinate ->
            modLocalRuntime coordinate
        }
        modLocalRuntime("mezz.jei:jei-${mc_version}-fabric:${jei_version}") { transitive = false }
        modLocalRuntime("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    accessWidenerPath = file('src/main/resources/avaritia.accesswidener')
    mixin { defaultRefmapName = 'avaritia.refmap.json' }
    // Compile against vanilla classes; installed integrations add their interfaces through runtime mixins.
    interfaceInjection { enableDependencyInterfaceInjection = false }
    mods {
        avaritia { sourceSet sourceSets.main }
        if (project.hasProperty('gameTests')) {
            avaritia_gametest { sourceSet sourceSets.gameTest }
        }
    }
    runs {
        client { runDir 'run/client' }
        server { runDir 'run/server' }
        if (project.hasProperty('gameTests')) {
            gameTestServer {
                server()
                source sourceSets.gameTest
                runDir 'run/gametest'
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
test { useJUnitPlatform() }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    withSourcesJar()
}
if (project.hasProperty('gameTests')) {
    tasks.named('runGameTestServer').configure {
        dependsOn tasks.named('gameTestClasses')
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version.toInteger()
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
Map<String, Object> expansionVariables = [
        version: project.version,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mc_version: project.mc_version,
        loader_version: project.loader_version,
        java_version: project.java_version,
        game_test_version: project.game_test_version
]
tasks.withType(ProcessResources).configureEach {
    inputs.properties expansionVariables
    filesMatching('fabric.mod.json') { expand expansionVariables }
}
tasks.named('wrapper').configure {
    gradleVersion = project.gradle_version
}
jar {
    from('LICENSE') { rename { "${it}_Re-Avaritia" } }
}
tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach {
    standardInput = System.in
}
