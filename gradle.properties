# Gradle settings
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2 -Dorg.gradle.internal.repository.max.retries=12 -Dorg.gradle.internal.repository.initial.backoff=1000 --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft & NeoForge versions  (backport target: MC 1.21.11 / NeoForge 21.11.42)
minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.21.12)
neo_version=21.11.45
neo_version_range=[21.11.42,)
loader_version_range=[4,)

# Java version (MC 1.21.11 runs on Java 21)
java_version=21

# Mod metadata
mod_id=avaritia
mod_name=Re-Avaritia
mod_loader=neoforge
mod_license=MIT
mod_version=1.4.2
mod_version_tag=port1.21.11
mod_group_id=committee.nova.mods
mod_authors=cnlimiter, cu6, lying_ice, IAFEnvoy, Asek3, MikhailTapio, NadienDev
mod_description=Are you the type of modded Minecraft player that makes a beeline for the designated \"end game\" and then gives up on ever playing again once you get there? Do you wish there was a way to make the process take significantly longer? Do you love GregTech, but wish it weren't so short? Do you sit down on your chest full of Galgadorian Drills and wish there was a mod that didn't just hand things to you on a silver platter?\n\n \n\nThis might be the mod for you!
issue_tracker=https://github.com/Nova-Committee/Re-Avaritia/issues
