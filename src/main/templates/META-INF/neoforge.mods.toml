# NeoForge 模组元数据 — ${mod_id}
# 此文件为模板，构建时通过 Gradle 的 ProcessResources 展开变量。

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Avaritia/Avaritia/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    logoFile = "avaritia.png"
    credits = "Avaritia Team & 3Nova Community"
    authors = "3Nova"
    description = """
        Avaritia — 为 Minecraft 26.1.2 打造的传奇级物品模组。
        添加了一系列强力工具、武器、护甲与无尽消耗品，
        包含 Infinity Pickaxe、Sword of the Cosmos 以及终极 Matter Cluster。
    """

# ── Mixin ─────────────────────────────────────────────────
# 声明 Mixin 配置文件，供 MDG 自动处理 Mixin AP 与 refmap

    enumExtensions = "META-INF/enumextensions.json"

[[mixins]]
config = "${mod_id}.mixins.json"

# ── 必要依赖 ──────────────────────────────────────────────

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# ── 可选兼容 ──────────────────────────────────────────────

[[dependencies.${mod_id}]]
    modId = "jei"
    type = "optional"
    versionRange = "[19,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "jade"
    type = "optional"
    versionRange = "[15,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "curios"
    type = "optional"
    versionRange = "[9,)"
    ordering = "NONE"
    side = "BOTH"
