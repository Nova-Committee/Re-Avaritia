name: Forge Action

on:
  push:
    branches: [ "neo/*" ]
  pull_request:
    branches: [ "neo/*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Re-Avaritia-neoforge-${{ github.sha }}
          path: build/libs/Re-Avaritia-neoforge-*.jar
          if-no-files-found: error
